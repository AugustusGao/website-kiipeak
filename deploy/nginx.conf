server {
    listen 80;
    listen [::]:80;
    server_name kiipeak.com www.kiipeak.com;
    location /.well-known/acme-challenge/ { root /var/www/kiipeak/acme; }
    location / { return 301 https://kiipeak.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.kiipeak.com;
    ssl_certificate /etc/letsencrypt/live/kiipeak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiipeak.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://kiipeak.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kiipeak.com;
    ssl_certificate /etc/letsencrypt/live/kiipeak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiipeak.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/kiipeak/current;
    index index.html;
    server_tokens off;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    error_page 404 /404.html;
    location / { try_files $uri $uri/ =404; add_header Cache-Control 'public, max-age=60'; }
    location /assets/ { expires 1h; }
    location ~ /\. { deny all; }
}
